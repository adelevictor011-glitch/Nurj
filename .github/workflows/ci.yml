name: Nurj CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install exactly what package-lock.json pins (same as Vercel).
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # api/ functions inline shared helpers (Vercel bundles each one alone),
      # so unused-helper warnings are expected there; real type errors are not.
      - run: npx tsc -p tsconfig.api.json --noUnusedLocals false --noUnusedParameters false
      - run: npm test
      - run: npm run build
