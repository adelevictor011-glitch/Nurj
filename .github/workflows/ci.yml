name: Nurj CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is committed (it was removed in July), so `npm ci` and the
      # npm cache cannot run. Install the same way Vercel does.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.api.json
      - run: npm test
      - run: npm run build
